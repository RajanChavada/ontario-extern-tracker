<!DOCTYPE html><html><head><title>Dayforce</title></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"jobData":{"jobPostingId":3892,"jobTitle":"Clinical Extern - Professional Practice ","postingStartTimestampUTC":"2026-11-06T05:00:00+00:00","postingExpiryTimestampUTC":"2026-11-21T04:59:00+00:00","jobPostingContent":{"jobDescription":"<p style=\"margin: 0in; font-size: 11pt; font-family: Calibri, sans-serif;\"><span style=\"font-family: arial, helvetica, sans-serif; font-size: 12pt;\"><strong>Job Description</strong></span></p>\n<p style=\"margin: 0in; font-size: 11pt; font-family: Calibri, sans-serif;\"><span style=\"font-family: arial, helvetica, sans-serif; font-size: 12pt;\"><span style=\"color: black;\"><br></span><span style=\"color: #1e1e1e; background: #fefefe;\">WCH is offering an exciting opportunity for <strong>Nursing students</strong> to come join our team as a <strong>Clinical Extern</strong>. In this role you will have the opportunity to work in a revolutionary organization supporting a skilled team of experienced nurses and health disciplines in the provision of ambulatory care.</span><span style=\"color: #1e1e1e;\"><br><br></span></span></p>\n<p style=\"margin: 0in; font-size: 11pt; font-family: Calibri, sans-serif;\"><span style=\"font-family: arial, helvetica, sans-serif; font-size: 12pt;\"><strong><span style=\"color: #1e1e1e; background: #fefefe;\">Employment Details</span></strong></span></p>\n<ul style=\"margin-bottom: 0in; margin-top: 0px;\">\n<li style=\"margin: 0in 0in 0in 0px; font-size: 12pt; font-family: arial, helvetica, sans-serif;\"><span style=\"color: #1e1e1e; background: #fefefe; font-family: arial, helvetica, sans-serif; font-size: 12pt;\">Temporary Clinical Extern position, up until <strong>March 31, 2027</strong></span></li>\n<li style=\"margin: 0in 0in 0in 0px; font-size: 12pt; font-family: arial, helvetica, sans-serif;\"><span style=\"color: #1e1e1e; background: #fefefe; font-family: arial, helvetica, sans-serif; font-size: 12pt;\">Hourly Rate: <strong>$20.60</strong> </span></li>\n<li style=\"margin: 0in 0in 0in 0px; font-size: 12pt; font-family: arial, helvetica, sans-serif;\"><span style=\"color: #1e1e1e; background: #fefefe; font-family: arial, helvetica, sans-serif; font-size: 12pt;\">Employment status: <strong>Temporary Part-Time</strong></span></li>\n<li style=\"margin: 0in 0in 0in 0px; font-size: 12pt; font-family: arial, helvetica, sans-serif;\"><span style=\"color: #1e1e1e; background: #fefefe; font-family: arial, helvetica, sans-serif; font-size: 12pt;\">Maximum of <strong>7.5</strong> <strong>hours per week</strong></span></li>\n<li style=\"margin: 0in 0in 0in 0px; font-size: 12pt; font-family: arial, helvetica, sans-serif;\"><span style=\"color: #1e1e1e; background: #fefefe; font-family: arial, helvetica, sans-serif; font-size: 12pt;\">Position type: <strong>Temporary Part-Time, Clinical Extern (RN)</strong></span></li>\n<li style=\"margin: 0in 0in 0in 0px; font-size: 12pt; font-family: arial, helvetica, sans-serif;\"><span style=\"color: #1e1e1e; background: #fefefe; font-family: arial, helvetica, sans-serif; font-size: 12pt;\">Schedule and hours are based on <strong>operational needs</strong></span></li>\n</ul>\n<p style=\"margin: 0in; font-size: 11pt; font-family: Calibri, sans-serif;\"><span style=\"color: #1e1e1e; font-family: arial, helvetica, sans-serif; font-size: 12pt;\"><br><strong><em><span style=\"background: #fefefe;\">As a member of the health care team, the Clinical Extern will:</span></em></strong></span></p>\n<p style=\"margin: 0in; font-size: 11pt; font-family: Calibri, sans-serif;\">&nbsp;</p>\n<ul style=\"margin-bottom: 0in; margin-top: 0px;\">\n<li style=\"text-align: justify; margin: 0in 0in 0in 0px; font-size: 12pt; font-family: arial, helvetica, sans-serif;\"><span style=\"color: #1e1e1e; background: #fefefe; font-family: arial, helvetica, sans-serif; font-size: 12pt;\">Provide limited direct patient care under supervision and direction of the registered health care team in a manner consistent with organizational policies, while taking into account CNO guidance for unregulated care providers.</span></li>\n<li style=\"text-align: justify; margin: 0in 0in 0in 0px; font-size: 12pt; font-family: arial, helvetica, sans-serif;\"><span style=\"color: #1e1e1e; background: #fefefe; font-family: arial, helvetica, sans-serif; font-size: 12pt;\">Provide basic support for the clinical team while having the opportunity to work in the hospital environment and develop professional relationships with the interdisciplinary team, patients and families.</span></li>\n<li style=\"text-align: justify; margin: 0in 0in 0in 0px; font-size: 12pt; font-family: arial, helvetica, sans-serif;\"><span style=\"color: #1e1e1e; background: #fefefe; font-family: arial, helvetica, sans-serif; font-size: 12pt;\">Work with the interprofessional care team and clinical program to ensure that they have the knowledge, skills and judgment needed to perform all actions/duties.</span></li>\n<li style=\"text-align: justify; margin: 0in 0in 0in 0px; font-size: 12pt; font-family: arial, helvetica, sans-serif;\"><span style=\"color: #1e1e1e; background: #fefefe; font-family: arial, helvetica, sans-serif; font-size: 12pt;\">Supports administrative, quality, and other non-patient care activities. </span></li>\n</ul>\n<p style=\"margin: 0in; font-size: 11pt; font-family: Calibri, sans-serif;\">&nbsp;</p>\n<p style=\"margin: 0in; font-size: 11pt; font-family: Calibri, sans-serif;\"><span style=\"font-family: arial, helvetica, sans-serif; font-size: 12pt;\"><span style=\"color: #1e1e1e; background: #fefefe;\">As a role model and champion, you will work to identify and integrate safe, best practices into daily activities to foster the delivery of safe and exemplary care.</span><span style=\"color: #1e1e1e;\"><br><br></span></span></p>\n<p style=\"margin: 0in; font-size: 11pt; font-family: Calibri, sans-serif;\"><span style=\"color: #1e1e1e; background: #fefefe; font-family: arial, helvetica, sans-serif; font-size: 12pt;\">The responsibilities described above are representative and are not to be construed as all-inclusive.</span></p>\n<p style=\"margin: 0in; font-size: 11pt; font-family: Calibri, sans-serif;\"><span style=\"font-family: arial, helvetica, sans-serif; font-size: 12pt;\"><strong><span style=\"color: black;\"><br></span></strong><strong>Qualifications</strong></span></p>\n<ul style=\"margin-bottom: 0in; margin-top: 0px;\">\n<li style=\"text-align: justify; margin: 0in 0in 0in 0px; font-size: 12pt; font-family: arial, helvetica, sans-serif;\"><span style=\"color: #1e1e1e; background: #fefefe; font-family: arial, helvetica, sans-serif; font-size: 12pt;\">Enrolled in an accredited degree (Bachelor of Science in Nursing) </span></li>\n<li style=\"text-align: justify; margin: 0in 0in 0in 0px; font-size: 12pt; font-family: arial, helvetica, sans-serif;\"><span style=\"color: #1e1e1e; background: #fefefe; font-family: arial, helvetica, sans-serif; font-size: 12pt;\">Completion of Basic Cardiac Life Support (B.C.L.S.) required.</span></li>\n<li style=\"text-align: justify; margin: 0in 0in 0in 0px; font-size: 12pt; font-family: arial, helvetica, sans-serif;\"><span style=\"color: #1e1e1e; background: #fefefe; font-family: arial, helvetica, sans-serif; font-size: 12pt;\">RNAO Best Practices Champion Certificate preferred </span></li>\n<li style=\"text-align: justify; margin: 0in 0in 0in 0px; font-size: 12pt; font-family: arial, helvetica, sans-serif;\"><span style=\"color: #1e1e1e; background: #fefefe; font-family: arial, helvetica, sans-serif; font-size: 12pt;\">Evidence of good academic standing.</span></li>\n<li style=\"text-align: justify; margin: 0in 0in 0in 0px; font-size: 12pt; font-family: arial, helvetica, sans-serif;\"><span style=\"color: #1e1e1e; background: #fefefe; font-family: arial, helvetica, sans-serif; font-size: 12pt;\">Knowledge of the Occupational Health &amp; Safety Act and other relevant legislation.</span></li>\n<li style=\"text-align: justify; margin: 0in 0in 0in 0px; font-size: 12pt; font-family: arial, helvetica, sans-serif;\"><span style=\"color: #1e1e1e; background: #fefefe; font-family: arial, helvetica, sans-serif; font-size: 12pt;\">Knowledge of the Workplace Hazardous Materials Information System.</span></li>\n<li style=\"text-align: justify; margin: 0in 0in 0in 0px; font-size: 12pt; font-family: arial, helvetica, sans-serif;\"><span style=\"color: #1e1e1e; background: #fefefe; font-family: arial, helvetica, sans-serif; font-size: 12pt;\">Knowledge of Emergency Codes.</span></li>\n<li style=\"text-align: justify; margin: 0in 0in 0in 0px; font-size: 12pt; font-family: arial, helvetica, sans-serif;\"><span style=\"color: #1e1e1e; background: #fefefe; font-family: arial, helvetica, sans-serif; font-size: 12pt;\">Demonstrated knowledge of infection control practices.</span></li>\n<li style=\"text-align: justify; margin: 0in 0in 0in 0px; font-size: 12pt; font-family: arial, helvetica, sans-serif;\"><span style=\"color: #1e1e1e; background: #fefefe; font-family: arial, helvetica, sans-serif; font-size: 12pt;\">Demonstrated effective communication (verbal and written), interpersonal, teamwork skills.</span></li>\n<li style=\"text-align: justify; margin: 0in 0in 0in 0px; font-size: 12pt; font-family: arial, helvetica, sans-serif;\"><span style=\"color: #1e1e1e; background: #fefefe; font-family: arial, helvetica, sans-serif; font-size: 12pt;\">Cultural awareness and sensitivity.</span></li>\n<li style=\"text-align: justify; margin: 0in 0in 0in 0px; font-size: 12pt; font-family: arial, helvetica, sans-serif;\"><span style=\"color: #1e1e1e; background: #fefefe; font-family: arial, helvetica, sans-serif; font-size: 12pt;\">Successful completion of a recent clinical placement preferred.</span></li>\n<li style=\"text-align: justify; margin: 0in 0in 0in 0px; font-size: 12pt; font-family: arial, helvetica, sans-serif;\"><span style=\"color: #1e1e1e; background: #fefefe; font-family: arial, helvetica, sans-serif; font-size: 12pt;\">Familiarity with computer applications including Electronic Medical Record, Epic experience preferred.</span></li>\n<li style=\"text-align: justify; margin: 0in 0in 0in 0px; font-size: 12pt; font-family: arial, helvetica, sans-serif;\"><span style=\"color: #1e1e1e; background: #fefefe; font-family: arial, helvetica, sans-serif; font-size: 12pt;\">Professional behaviour and communication that meets the standards of the professional regulatory college or association, as applicable, and the standards of Women&rsquo;s College Hospital</span></li>\n<li style=\"text-align: justify; margin: 0in 0in 0in 0px; font-size: 12pt; font-family: arial, helvetica, sans-serif;\"><span style=\"color: #1e1e1e; background: #fefefe; font-family: arial, helvetica, sans-serif; font-size: 12pt;\">You will play a critical role in acting as an advocate for safety and will demonstrate principles, practices and processes that will optimize a safe environment for all.</span></li>\n</ul>"}}}},"page":"/[clientNamespace]/[jobBoardCode]/jobs/[jobId]"}</script></body></html>
